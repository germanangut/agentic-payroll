[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-nomina"
version = "0.1.0"
description = "Baseline reconciliation engine for Colombian payroll audits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
agentic-nomina = "agentic_nomina.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_nomina"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
