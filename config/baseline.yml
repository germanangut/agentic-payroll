company:
  name: "Empresa piloto"
  country: "CO"

rule_governance:
  authorization_matrix:
    default:
      validation_roles: ["PAYROLL_ANALYST"]
      approval_roles: ["PAYROLL_OWNER"]
      evidence_types: ["SYNTHETIC_RECORD"]
  registry:
    - rule_id: "social_security_baseline"
      rule_version: "1.0"
      rule_name: "Aportes de salud, pensión y días trabajados"
      active: true
      financial: true
    - rule_id: "overtime_hours_cap"
      rule_version: "1.0"
      rule_name: "Tope provisional de horas extras"
      active: true
      financial: true
    - rule_id: "los_olivos_monthly_invoice"
      rule_version: "1.0"
      rule_name: "Descuento mensual Los Olivos"
      active: true
      financial: true
    - rule_id: "comfatolima_expected_installment"
      rule_version: "1.0"
      rule_name: "Cuota esperada Comfatolima"
      active: true
      financial: true
    - rule_id: "employee_loan_balance_movement"
      rule_version: "1.0"
      rule_name: "Movimiento de saldos de préstamos"
      active: true
      financial: true
    - rule_id: "absence_evidence_vs_payroll"
      rule_version: "1.0"
      rule_name: "Evidencia de ausencias contra novedad liquidada"
      active: true
      financial: false

review_continuity:
  reusable_non_financial_rule_ids: ["absence_evidence_vs_payroll"]

payroll:
  sheet_name: "Hoja1"
  header_markers: ["EMPLEADO", "NOMBRE EMPLEADO"]
  concepts:
    employee_id: "EMPLEADO"
    employee_name: "NOMBRE EMPLEADO"
    salary: "SUELDO BASICO"
    health_employee: "APORTES SALUD"
    pension_employee: "APORTE PENSION"
    overtime_day: "HORA EXTRA DIURNA"
    overtime_night: "HORA EXTRA NOCTUR"
    night_surcharge: "RECARGO NOCTURNO"
    los_olivos: "LOS OLIVOS SEGURO"
    comfatolima: "COMFATOLIMA PREST"
    loan: "PRESTAMOS Y/O ANT"
    incapacity: "INCAPACIDAD"
    permission: "PERMISO"

absences:
  payroll_units:
    INCAPACIDAD: "incapacity_units"
    PERMISO: "permission_units"

employee_list:
  sheet_name: "Hoja1"
  header_markers: ["NIT", "NOMBRE", "EST"]
  fields:
    employee_id: "NIT"
    employee_name: "NOMBRE"
    status: "EST"
    retirement_date: "F. RETIRO"

pila:
  sheet_name: "Sheet1"
  columns_zero_based:
    employee_id: 4
    employee_name: 8
    pension_days: 35
    pension_ibc: 36
    pension_total_contribution: 38
    health_days: 42
    health_ibc: 43
    health_employee_contribution: 46
    ccf_days: 48
    ccf_ibc: 50
    ccf_contribution: 51
    arl_days: 55
    arl_ibc: 58
    arl_rate: 61
    arl_contribution: 62
    total_contributions: 69

reconciliation:
  health_employee_rate: 0.04
  pension_employee_rate: 0.04
  monetary_rounding: 100
  monetary_tolerance: 200
  days_tolerance: 0

overtime:
  sheet_name: "TOTAL HORAS EXTRAS"
  header_row_zero_based: 1
  columns_zero_based:
    employee_id: 0
    employee_name: 1
    group: 2
    cost_center: 3
    subcost_center: 4
    role: 5
    reported_day_hours: 51
    reported_night_hours: 52
    reported_surcharge_hours: 53
    pending_day_hours: 55
    pending_night_hours: 56
    pending_surcharge_hours: 57
    deduct_hours: 59
  rules:
    rule_id: "overtime_hours_cap"
    rule_version: "1.0"
    rule_status: "provisional"
    minimum_hours: 0
    caps_hours:
      day: 24
      night: 24
      surcharge: 24
    hours_tolerance: 0.01
    monetary_rounding: 1
    adjusted_match_severity: "WARNING"

external_deductions:
  rules:
    rule_version: "1.0"
    rule_status: "provisional"
    monetary_tolerance: 0
  los_olivos:
    rule_id: "los_olivos_monthly_invoice"
    payroll_field: "los_olivos_value"
    period_label: "MONTH"
    expected_total: 699200
  comfatolima:
    rule_id: "comfatolima_expected_installment"
    payroll_field: "comfatolima_value"
    period_label: "MONTH"
    expected_month: "FEB2026"

loans:
  rules:
    rule_id: "employee_loan_balance_movement"
    rule_version: "1.0"
    rule_status: "provisional"
    monetary_tolerance: 0
  reports:
    q1:
      expected_reported_total: 3829379
      expected_debit_total: 900000
    q2:
      expected_reported_total: 3503397
      expected_debit_total: 700000
